name: Build x86 ASI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download pinned LLVM-MinGW
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip'
          New-Item -ItemType Directory -Force -Path toolchain | Out-Null
          Invoke-WebRequest $url -OutFile toolchain/llvm-mingw.zip
          $actual = (Get-FileHash toolchain/llvm-mingw.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a'
          if ($actual -ne $expected) { throw "Compiler archive hash mismatch: $actual" }
          Expand-Archive toolchain/llvm-mingw.zip toolchain

      - name: Build and check x86 output
        shell: pwsh
        run: ./src/build.ps1

      - name: Package distribution
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath PacManWorld3FPSFix-1.0.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PacManWorld3FPSFix-${{ github.sha }}
          path: PacManWorld3FPSFix-1.0.0.zip
          if-no-files-found: error
